plugins {
    id 'java'
    id 'io.qameta.allure' version '4.3.0'
}

group = 'qa.guru'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

allure {
    version = "2.32.0"
    adapter {
        aspectjWeaver = true
        frameworks {
            junit5 {
                adapterVersion = "2.32.0"
            }
        }
    }
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
}

test {
    useJUnitPlatform()
    ignoreFailures = true

    testLogging {
        lifecycle {
            events "started", "skipped", "failed", "standard_error", "standard_out"
            exceptionFormat "short"
        }
    }
}